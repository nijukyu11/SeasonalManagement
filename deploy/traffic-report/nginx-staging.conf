# Include this server block alongside the production report config.
# It deliberately reuses the existing http-level cache/rate-limit zones and
# never points at /srv/seasonal-traffic-report/current.
server {
    listen 127.0.0.1:8781;
    server_name _;

    root /srv/seasonal-traffic-report/staging-current;
    index index.html;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/report/v1/kpi-admin/lock {
        if ($request_method != POST) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "annual_kpi_admin=locked; Path=/api/report/v1/kpi-admin; Max-Age=1; HttpOnly; Secure; SameSite=Strict" always;
        return 200 '{"unlocked":false}';
    }

    location = /api/report/v1/kpi-config {
        limit_req zone=traffic_report_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9002/traffic-report/v1/kpi-config;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/report/v1/kpi-admin/ {
        proxy_pass http://127.0.0.1:9002/traffic-report/v1/kpi-admin/;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location /api/report/ {
        limit_req zone=traffic_report_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9002/traffic-report/;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        proxy_cache traffic_report;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme|$request_method|$host|$uri|$is_args$args";
        proxy_cache_valid 200 60s;
        proxy_cache_valid any 0;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_background_update off;
        proxy_cache_use_stale off;
        proxy_no_cache $http_authorization $cookie_session;
        proxy_cache_bypass $http_authorization $cookie_session;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~* ^/_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        return 308 /reports/traffic;
    }

    location = /reports/traffic {
        try_files /reports/traffic.html =404;
    }

    location = /dashboard {
        try_files /reports/traffic/dashboard.html =404;
    }

    location = /reports/traffic.txt {
        try_files $uri =404;
    }

    location ^~ /reports/traffic/ {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
