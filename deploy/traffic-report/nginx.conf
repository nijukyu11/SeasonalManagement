# Install the http-level directives inside nginx.conf, then include the server block.
proxy_cache_path /var/cache/nginx/traffic-report levels=1:2 keys_zone=traffic_report:32m max_size=2g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=traffic_report_per_ip:10m rate=30r/m;

server {
    listen 127.0.0.1:8780;
    server_name reports.ahtops.xyz;

    root /srv/seasonal-traffic-report/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/report/ {
        limit_req zone=traffic_report_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9001/traffic-report/;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        proxy_cache traffic_report;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme|$request_method|$host|$uri|$is_args$args";
        proxy_cache_valid 200 60s;
        proxy_cache_valid any 0;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_background_update off;
        proxy_cache_use_stale off;
        proxy_no_cache $http_authorization $cookie_session;
        proxy_cache_bypass $http_authorization $cookie_session;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~* ^/_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
